---
# Example 1: Name-based mode (RECOMMENDED - most automatic)
# The controller finds the GA by name across all regions
# - Primary region: Create GA via annotations (standard h3poteto approach)
# - All regions: Use this binding with the GA name - no ARN needed!
# - Controller automatically creates endpoint groups per region
apiVersion: operator.h3poteto.dev/v1alpha1
kind: EndpointGroupBinding
metadata:
  name: h3poteto-test-name
  namespace: default
spec:
  globalAcceleratorName: my-service-global-accelerator
  weight: 100
  clientIPPreservation: true
  serviceRef:
    name: h3poteto-test
---
# Example 2: Accelerator ARN mode
# Use this when you have the GA ARN and want automatic endpoint group management
# Controller automatically creates endpoint groups for the current region
apiVersion: operator.h3poteto.dev/v1alpha1
kind: EndpointGroupBinding
metadata:
  name: h3poteto-test-accelerator
  namespace: default
spec:
  acceleratorArn: arn:aws:globalaccelerator::564677439943:accelerator/d113ae41-29df-496d-b8d2-316b322764bf
  weight: 100
  clientIPPreservation: true
  serviceRef:
    name: h3poteto-test
---
# Example 3: Direct endpoint group ARN mode (legacy)
# Use this when you already know the exact endpoint group ARN
# Least flexible - requires manual management
apiVersion: operator.h3poteto.dev/v1alpha1
kind: EndpointGroupBinding
metadata:
  name: h3poteto-test-direct
  namespace: default
spec:
  endpointGroupArn: arn:aws:globalaccelerator::564677439943:accelerator/d113ae41-29df-496d-b8d2-316b322764bf/listener/f1fe2960/endpoint-group/eea4ad34cd00
  weight: 100
  serviceRef:
    name: h3poteto-test
